name: Offline package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check.py --payloads-only
      - run: python -m compileall -q src tools tests fujitools
      - run: python -m unittest discover -s tests -p test_public_package.py -v
